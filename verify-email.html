<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Email Verification - CoinVault</title>
    <meta name="description" content="Confirm your email address using your CoinVault verification link and continue to your account.">
    <meta name="author" content="CoinVault">
    <meta name="application-name" content="CoinVault">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#111827">
    <link rel="canonical" href="https://www.coinvaultnet.com/verify-email.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="CoinVault">
    <meta property="og:locale" content="en_US">
    <meta property="og:url" content="https://www.coinvaultnet.com/verify-email.html">
    <meta property="og:title" content="Email Verification - CoinVault">
    <meta property="og:description" content="Confirm your email address using your CoinVault verification link and continue to your account.">
    <meta property="og:image" content="https://www.coinvaultnet.com/apple-touch-icon.png">
    <meta property="og:image:width" content="180">
    <meta property="og:image:height" content="180">
    <meta property="og:image:alt" content="CoinVault logo">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Email Verification - CoinVault">
    <meta name="twitter:description" content="Confirm your email address using your CoinVault verification link and continue to your account.">
    <meta name="twitter:image" content="https://www.coinvaultnet.com/apple-touch-icon.png">
    <meta name="twitter:image:alt" content="CoinVault logo">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Coinvault" />
<link rel="manifest" href="/site.webmanifest" />
<link rel="stylesheet" href="css/auth-pages.css">
<script src="js/config.js"></script>
</head>
<body class="auth-page">
<main class="auth-center-shell">
    <section class="auth-card compact" aria-label="Email verification status">
        <div class="auth-icon" id="brandIcon">
            <img src="favicon.svg" alt="CoinVault logo">
        </div>

        <div class="verify-badge hidden" id="badge">OK</div>
        <div class="verify-badge error hidden" id="errorBadge">!</div>

        <div class="auth-card-head" style="text-align:center">
            <h2 id="title">Email verification</h2>
            <p id="message">Verifying your email link...</p>
        </div>

        <div class="loader" id="loader"></div>

        <div class="auth-actions">
            <a class="auth-submit hidden" id="dashboardBtn" href="index.html">Go to dashboard</a>
            <a class="auth-secondary hidden" id="loginBtn" href="login.html">Back to sign in</a>
        </div>
    </section>
</main>

<script>
function hideBrandIcon() {
    document.getElementById("brandIcon").style.display = "none";
}

function showSuccess() {
    hideBrandIcon();
    document.getElementById("loader").style.display = "none";
    document.getElementById("badge").classList.remove("hidden");
    document.getElementById("title").textContent = "Email verified";
    document.getElementById("message").innerHTML =
        "<strong>Your CoinVault account is ready.</strong><br>You are being redirected to your dashboard.";
    document.getElementById("dashboardBtn").classList.remove("hidden");
}

function showError(msg) {
    hideBrandIcon();
    document.getElementById("loader").style.display = "none";
    document.getElementById("errorBadge").classList.remove("hidden");
    document.getElementById("title").textContent = "Verification failed";
    document.getElementById("message").textContent = msg;
    document.getElementById("loginBtn").classList.remove("hidden");
}

async function verifyEmail() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
        showError("This verification link is invalid. Please request a new one.");
        return;
    }

    try {
        const data = await CONFIG.apiRequest('/auth/verify-email', {
            method: 'POST',
            body: { token },
            auth: false
        });

        if (data.success) {
            if (data.token) {
                localStorage.setItem("token", data.token);
            }

            showSuccess();

            setTimeout(() => {
                window.location.href = "index.html";
            }, 3000);
        } else {
            showError(data.message || "Verification failed. The link may have expired.");
        }
    } catch (error) {
        showError(error.message || "Could not verify your email right now. Please try again.");
    }
}

verifyEmail();
</script>
</body>
</html>
