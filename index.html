<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <title>Wallet - CoinVault</title>
    <meta name="description" content="View your CoinVault wallets, asset balances, live Bitcoin price and transaction history. Manage your account from one connected workspace.">
    <meta name="author" content="CoinVault">
    <meta name="application-name" content="CoinVault">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://www.coinvaultnet.com/index.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="CoinVault">
    <meta property="og:locale" content="en_US">
    <meta property="og:url" content="https://www.coinvaultnet.com/index.html">
    <meta property="og:title" content="Wallet - CoinVault">
    <meta property="og:description" content="View your CoinVault wallets, asset balances, live Bitcoin price and transaction history. Manage your account from one connected workspace.">
    <meta property="og:image" content="https://www.coinvaultnet.com/apple-touch-icon.png">
    <meta property="og:image:width" content="180">
    <meta property="og:image:height" content="180">
    <meta property="og:image:alt" content="CoinVault logo">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Wallet - CoinVault">
    <meta name="twitter:description" content="View your CoinVault wallets, asset balances, live Bitcoin price and transaction history. Manage your account from one connected workspace.">
    <meta name="twitter:image" content="https://www.coinvaultnet.com/apple-touch-icon.png">
    <meta name="twitter:image:alt" content="CoinVault logo">
    <link rel="icon" type="image/png" href="favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="CoinVault">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="css/account-workspace.css">
    <script src="js/auth.js"></script>
    <script src="js/vendor/feather.min.js" defer></script>
    <script src="js/account-shell.js" defer></script>
    <script src="js/payment-logos.js" defer></script>
    <script src="js/account-dashboard.js" defer></script>
</head>
<body class="cv-account">
    <div class="cv-layout" id="cvDashboard">
        <header class="cv-topbar">
            <a href="index.html" class="cv-mobile-brand"><img class="cv-logo" src="favicon-96x96.png" alt="">CoinVault</a>
            <div class="cv-breadcrumb">Wallets <span>/ <span id="cvBreadcrumbWallet">All wallets</span></span></div>
            <div class="cv-top-actions">
                <button class="cv-icon" id="cvHideBalance" title="Hide balances" aria-label="Hide balances" aria-pressed="false"><i data-feather="eye"></i></button>
                <button class="cv-icon cv-mobile-menu" data-cv-menu title="Open navigation" aria-label="Open navigation"><i data-feather="menu"></i></button>
            </div>
        </header>
        <main class="cv-main">
            <div class="cv-inline-error" id="cvLoadError" role="alert" hidden><span id="cvErrorMessage"></span><button class="cv-link" id="cvRetry">Retry</button></div>
            <div class="cv-title-row">
                <div><h1 id="cvWalletTitle">All wallets</h1><p class="cv-subtitle" id="cvWalletCount">Loading account...</p></div>
                <select class="cv-mobile-selector" id="cvMobileWallet" aria-label="Choose wallet"><option value="all">All wallets</option></select>
                <div class="cv-actions">
                    <button class="cv-button" data-cv-receive><i data-feather="arrow-down"></i>Receive</button>
                    <button class="cv-button primary" data-cv-withdraw disabled><i data-feather="arrow-up"></i>Withdraw</button>
                    <div class="cv-menu-wrap"><button class="cv-icon" data-cv-more title="More actions" aria-label="More actions" aria-expanded="false" style="border-color:var(--cv-line)"><i data-feather="more-horizontal"></i></button><div class="cv-dropdown" hidden><a href="send.html"><i data-feather="send"></i>Send</a><a href="buy.html"><i data-feather="plus-circle"></i>Buy</a><a href="sell.html"><i data-feather="minus-circle"></i>Sell</a></div></div>
                </div>
            </div>
            <section class="cv-total" aria-label="Wallet balance"><p>Total value</p><h2 class="cv-sensitive" id="cvTotalBalance">--</h2><small id="cvBtcPrice" aria-live="polite">BTC price loading...</small></section>
            <div class="cv-tabs" role="tablist" aria-label="Wallet view"><button class="cv-tab" role="tab" id="cvBalancesTab" aria-selected="true" aria-controls="cvBalancesPanel">Balances</button><button class="cv-tab" role="tab" id="cvActivityTab" aria-selected="false" aria-controls="cvActivityPanel" tabindex="-1">Activity</button></div>
            <section id="cvBalancesPanel" role="tabpanel" aria-labelledby="cvBalancesTab">
                <h2 class="cv-section-title" id="assetsHeading">Assets</h2>
                <div class="cv-assets" id="cvAssets"><div class="cv-empty">Loading assets...</div></div>
                <div class="cv-bottom-grid">
                    <section><h2 class="cv-section-title">Recent activity</h2><div id="cvRecentActivity"><div class="cv-empty">Loading activity...</div></div><button class="cv-link" id="cvViewActivity" style="margin-top:16px">View all activity<i data-feather="arrow-right"></i></button></section>
                    <section class="cv-details"><h2 class="cv-section-title">Wallet details</h2><p class="cv-muted" id="cvDetailsCount">--</p><div id="cvDetailsAddresses"></div><button class="cv-link" data-cv-connect><i data-feather="plus-circle"></i>Connect another wallet</button><button class="cv-link" id="cvDisconnect" style="display:none;margin-top:20px;color:#fca5a5!important"><i data-feather="link-2"></i>Disconnect Bitcoin wallet</button></section>
                </div>
            </section>
            <section id="cvActivityPanel" role="tabpanel" aria-labelledby="cvActivityTab" hidden>
                <div class="cv-title-row"><h2 class="cv-section-title">All transactions</h2><select id="cvActivityFilter" class="cv-mobile-selector" style="display:block;width:auto" aria-label="Filter transactions"><option value="all">All activity</option><option value="received">Received</option><option value="sent">Sent</option><option value="withdrawal">Withdrawals</option></select></div><div id="cvAllActivity"></div>
            </section>
        </main>
        <nav class="cv-mobile-actionbar" aria-label="Wallet actions"><button class="cv-button" data-cv-receive><i data-feather="arrow-down"></i>Receive</button><button class="cv-button primary" data-cv-withdraw disabled><i data-feather="arrow-up"></i>Withdraw</button><div class="cv-menu-wrap"><button class="cv-button" data-cv-more aria-label="More actions" aria-expanded="false"><i data-feather="more-horizontal"></i>More</button><div class="cv-dropdown" hidden><a href="send.html"><i data-feather="send"></i>Send</a><a href="buy.html"><i data-feather="plus-circle"></i>Buy</a><a href="sell.html"><i data-feather="minus-circle"></i>Sell</a></div></div></nav>
    </div>
    <dialog class="cv-drawer" id="cvWithdrawDrawer" aria-label="Withdraw funds"><button class="cv-icon cv-drawer-close" id="cvCloseWithdraw" title="Close withdrawal" aria-label="Close withdrawal"><i data-feather="x"></i></button><iframe id="cvWithdrawFrame" title="CoinVault withdrawal"></iframe></dialog>
    <dialog class="cv-dialog" id="cvAssetDialog" aria-labelledby="cvAssetTitle"><div class="cv-dialog-heading"><h2 id="cvAssetTitle">Asset</h2><button class="cv-icon" id="cvAssetClose" title="Close" aria-label="Close"><i data-feather="x"></i></button></div><div id="cvAssetInfo"></div></dialog>
</body>
</html>
